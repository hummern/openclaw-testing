<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Automated edit: 2025-06-17 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Accessible HTML5 website with WCAG AAA compliance">
  <title>Accessible HTML5 Demo</title>
  <link rel="stylesheet" href="styles.css">
  <meta property="og:title" content="Accessible HTML5 Demo">
  <meta property="og:description" content="A WCAG AAA compliant HTML5 website demonstrating modern web accessibility practices">
  <meta property="og:image" content="https://example.com/og-image.png">
</head>
<body>
  <header role="banner">
    <h1>Accessible HTML5 Demo</h1>
    <nav aria-label="Main">
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#content">Content</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main role="main">
    <section id="home" aria-labelledby="section-home">
      <h2 id="section-home">Home Section</h2>
      <article>
        <h3>Article Title</h3>
        <p>Accessible paragraph content.</p>
        <figure>
          <img src="placeholder.jpg" alt="Description of image">
          <figcaption>Figure caption</figcaption>
        </figure>
      </article>
    </section>

    <section id="content" aria-labelledby="section-content">
      <h2 id="section-content">Content Section</h2>
      <form>
        <fieldset>
          <legend>Form Legend</legend>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
          <button type="submit">Submit</button>
        </fieldset>
      </form>
      <table>
        <caption>Table Caption</caption>
        <thead>
          <tr>
            <th scope="col">Header 1</th>
            <th scope="col">Header 2</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Row 1, Cell 1</td>
            <td>Row 1, Cell 2</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section id="contact" aria-labelledby="section-contact">
      <h2 id="section-contact">Contact Section</h2>
      <div role="application" aria-label="Contact Form">
        <form>
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" cols="50"></textarea>
          <button type="submit">Send</button>
        </form>
      </div>
    </section>
  </main>

  <footer role="contentinfo">
    <p>&copy; 2026 Accessible HTML5 Demo. All rights reserved.</p>
  </footer>
</body>
</html>
