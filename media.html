<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media - WCAG AAA HTML5</title>
    <style>
        :root { --primary: #000080; --secondary: #FFFFFF; --accent: #008000; }
        body { font-family: Arial, sans-serif; line-height: 1.6; color: var(--primary); background: var(--secondary); margin: 0; }
        a:focus, button:focus, input:focus { outline: 3px solid var(--primary); outline-offset: 2px; }
        header { background: var(--primary); color: var(--secondary); padding: 1rem; }
        nav { background: var(--primary); padding: 0.5rem; }
        nav a { color: var(--secondary); text-decoration: none; padding: 0.5rem 1rem; display: inline-block; }
        nav a:hover { background: var(--accent); }
        main { max-width: 1200px; margin: 0 auto; padding: 1rem; }
        article, section { border: 1px solid var(--primary); padding: 1rem; margin: 1rem 0; }
        footer { background: var(--primary); color: var(--secondary); text-align: center; padding: 1rem; margin-top: 2rem; }
        figure { text-align: center; }
    </style>
</head>
<body>
    <header role="banner"><h1>Media Examples</h1></header>
    <nav role="navigation" aria-label="Main Navigation">
        <a href="index.html">Home</a>
        <a href="forms.html">Forms</a>
        <a href="media.html" aria-current="page">Media</a>
        <a href="tables.html">Tables</a>
        <a href="interactive.html">Interactive</a>
    </nav>
    <main id="main" role="main">
        <article>
            <h2>Audio and Video</h2>
            <figure>
                <svg width="320" height="240" viewBox="0 0 320 240" role="img" aria-label="Placeholder">
                    <rect width="320" height="240" fill="#e0e0e0"/>
                    <text x="160" y="120" text-anchor="middle" dy=".3em" fill="#666">Media Placeholder</text>
                </svg>
                <figcaption>Media content with audio and video elements</figcaption>
            </figure>
            <section>
                <h3>Audio</h3>
                <audio controls aria-label="Audio example"><source src="audio.mp3" type="audio/mpeg">Your browser does not support audio.</audio>
            </section>
            <section>
                <h3>Video</h3>
                <video controls width="320" height="240" aria-label="Video example"><source src="video.mp4" type="video/mp4">Your browser does not support video.</video>
            </section>
        </article>
    </main>
    <footer role="contentinfo"><p>&copy; 2026 WCAG AAA Media Example</p></footer>
</body>
</html>
