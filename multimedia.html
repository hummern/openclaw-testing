<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Multimedia page - accessible HTML5 demo">
  <title>Multimedia - Accessible HTML5 Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header role="banner">
    <h1>Multimedia Page</h1>
    <nav aria-label="Main">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="forms.html">Forms</a></li>
        <li><a href="tables.html">Tables</a></li>
        <li><a href="multimedia.html">Multimedia</a></li>
        <li><a href="interactive.html">Interactive</a></li>
      </ul>
    </nav>
  </header>

  <main role="main">
    <section aria-labelledby="audio-heading">
      <h2 id="audio-heading">Accessible Audio</h2>
      <audio controls aria-label="Playable audio file">
        <source src="sample-audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </section>

    <section aria-labelledby="video-heading">
      <h2 id="video-heading">Accessible Video</h2>
      <video controls aria-label="Playable video file">
        <source src="sample-video.mp4" type="video/mp4">
        Your browser does not support the video element.
      </video>
    </section>
  </main>

  <footer role="contentinfo">
    <p>&copy; 2026 Accessible HTML5 Demo. All rights reserved.</p>
  </footer>
</body>
</html>
