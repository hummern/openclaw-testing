name: Secret Scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Determine changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            files=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          else
            files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          fi
          files_single_line=$(echo "$files" | tr '\n' ' ')
          echo "files=$files_single_line" >> "$GITHUB_OUTPUT"

      - name: Run secret scan
        run: |
          if [ -z "${{ steps.changed.outputs.files }}" ]; then
            echo "No changed files to scan."
            exit 0
          fi
          bash scripts/secret-scan.sh files ${{ steps.changed.outputs.files }}
